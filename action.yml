name: "Setup ASPL Installation"
description: "GitHub Action for setting up an ASPL installation in your workspace"
author: "Wertzui123"
branding:
  color: "purple"
  icon: "code"
runs:
  using: "composite"
  steps:
    - env:
        GITHUB_TOKEN: ${{ github.token }}
      run: ${{ github.action_path }}/setup.sh
      shell: bash
